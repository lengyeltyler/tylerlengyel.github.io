<!doctype html>
<html lang="en">
<head>
  <!-- PWA -->
  <link rel="manifest" href="/nakes/manifest.json">
  <meta name="theme-color" content="#17191C">
  <!-- iOS standalone feel when added to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta charset="utf-8" />
  <title>Snake</title>
  <meta name="description" content="Retro Snake - keyboard, swipe, and D-pad." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <script src="/assets/site-shell.js?v=20261127-stamps"></script>
  <link rel="stylesheet" href="/assets/site-theme.css?v=20261116-sitewide-theme" />

  <style>
    :root{
      --off-white:#f2f0ea;

      --dark-0:#050505;
      --dark-1:#111111;
      --dark-2:#1d1d1d;

      --panel-dark-0:#080808;
      --panel-dark-1:#151515;
      --panel-dark-2:#232323;

      --blue-0:#d9f2ff;
      --blue-1:#b1e6ff;
      --blue-2:#75c6eb;

      --bg:#050505;
      --grid:rgba(250,247,240,.12);
      --nakes:#b1e6ff;
      --nakesHead:#faf7f0;
      --food:#75c6eb;
      --ui:#faf7f0;
      --accent:#b1e6ff;

      --size:20;
      --desktop-max:1440px;
      --gap:8px;

      --safe-top: env(safe-area-inset-top);
      --safe-right: env(safe-area-inset-right);
      --safe-bottom: env(safe-area-inset-bottom);
      --safe-left: env(safe-area-inset-left);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}

    body{
      background:var(--surface-canvas);
      color:var(--ink);
      font-family:"SF Pro Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      -webkit-user-select:none;
      user-select:none;
      overflow:hidden;
    }

    .nakes-page{
      height:100dvh;
      display:grid;
      grid-template-rows:auto minmax(0,1fr);
    }

    .app{
      position:relative;
      min-height:0;
      padding:calc(var(--safe-top) + 10px) calc(var(--safe-right) + 10px)
              calc(var(--safe-bottom) + 10px) calc(var(--safe-left) + 10px);
      display:grid;
      grid-template-rows:minmax(0,1fr) auto;
      gap:var(--gap);
      max-width:min(100vw,100svw);
      max-height:100%;
    }

    .hud{
      position:static;
      width:100%;
      max-width:var(--desktop-max);
      padding:0;
      display:flex;
      justify-content:space-between;
      gap:6px;
      flex-wrap:wrap;
      pointer-events:none;
    }

    .title{
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--ink);
      text-shadow:0 2px 14px rgba(177,230,255,.3);
    }

    .stats{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .pill{
      pointer-events:auto;
      border:1px solid rgba(250,247,240,.14);
      border-radius:0;
      padding:5px 9px;
      font-size:13px;
      color:var(--off-white);
      background:linear-gradient(
        135deg,
        var(--panel-dark-0) 0%,
        var(--panel-dark-1) 50%,
        var(--panel-dark-2) 100%
      );
      box-shadow:0 10px 22px rgba(0,0,0,.28);
    }

    .stage{
      position:relative;
      display:grid;
      place-items:center;
      grid-template-rows:auto minmax(0,1fr);
      gap:8px;
      min-height:0;
    }

    canvas{
      display:block;
      width:100%;
      height:auto;
      max-width:var(--desktop-max);
      aspect-ratio:27/16;
      border:1px solid rgba(250,247,240,.14);
      border-radius:0;
      background:linear-gradient(
        135deg,
        var(--panel-dark-0) 0%,
        var(--panel-dark-1) 50%,
        var(--panel-dark-2) 100%
      );
      box-shadow:0 24px 60px rgba(0,0,0,.34);
      image-rendering:auto;
      touch-action:none;
    }

    .controls{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:4px;
      max-width:850px;
      margin:0 auto;
      padding-bottom:2px;
    }

    .btn{
      border:1px solid rgba(250,247,240,.16);
      border-radius:0;
      padding:3px 7px;
      min-height:24px;
      line-height:1.2;
      text-align:center;
      background:linear-gradient(
        135deg,
        var(--blue-0) 0%,
        var(--blue-1) 45%,
        var(--blue-2) 100%
      );
      color:#211d27;
      font-weight:800;
      cursor:pointer;
      transition:transform .04s ease, background .1s ease, box-shadow .1s ease, opacity .1s ease;
      touch-action:manipulation;
      font-size:12px;
      box-shadow:0 12px 28px rgba(0,0,0,.24);
    }

    .btn:active{
      transform:translateY(1px) scale(.99);
      opacity:.9;
    }

    .btn:hover{
      box-shadow:0 16px 34px rgba(117,198,235,.2);
    }

    .btn:focus-visible {
      outline:3px solid #b1e6ff;
      outline-offset:3px;
    }

    .grid-spacer{display:none}
    .controls .utility { font-size:11px; padding:3px 7px; }
    .board-wrap { position:relative; min-height:0; width:100%; height:100%; display:grid; place-items:center; }
    .game-message { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
    .game-message[hidden] { display:none; }
    .game-message span { max-width:85%; padding:14px 22px; background:#101c15eb; border:1px solid #92b979; color:#f2f0ea; text-align:center; font-weight:700; line-height:1.5; white-space:pre-line; }

    .extras{
      max-width:850px;
      margin:4px auto 0;
      font-size:12px;
      text-align:center;
    }
    .extras summary{cursor:pointer; color:var(--muted); font-size:12px;}
    .extras[open]{text-align:left; max-height:140px; overflow:auto;}

    .help{
      font-size:13px;
      color:var(--muted);
      margin:4px 0;
    }

    #prize-root {
      color:var(--off-white);
    }

    @media (max-width: 640px){
      .hud{
        position:static;
        inset:auto;
        padding:0 2px 6px 2px;
        display:block;
        pointer-events:auto;
      }

      .title{
        font-size:13px;
        margin-bottom:4px;
      }

      .stats{
        display:grid;
        grid-template-columns:repeat(2, minmax(0,1fr));
        gap:4px 6px;
      }

      .pill{
        font-size:11px;
        padding:3px 7px;
        border-radius:0;
      }

      .btn{
        padding:5px 7px;
        font-size:13px;
        border-radius:0;
      }

      .controls{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        max-width:320px;
        gap:4px;
      }
      .grid-spacer{display:block;visibility:hidden;}

      .app { gap:6px; }
      .controls .utility{padding:5px 3px;font-size:11px;}
    }
    @media (pointer:coarse){
      .controls .btn{min-height:44px;}
    }
    @media (orientation:landscape) and (max-height:640px){
      .app{grid-template-columns:minmax(0,1fr) minmax(200px,300px);grid-template-rows:minmax(0,1fr);align-items:center;}
      .stage{height:100%;}
      .hud{display:block;padding:0;}
      .stats{gap:4px;}
      .pill{font-size:11px;padding:3px 6px;}
      .controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;max-width:280px;}
      .grid-spacer{display:block;visibility:hidden;}
      .btn{padding:5px;font-size:13px;}
      .extras{display:none;}
    }
  </style>
</head>

<body class="nakes-page">
  <header data-site-header="nakes"></header>
  <div class="app">
    <div class="stage">
      <div class="hud">
        <div class="title">S N A K E</div>

        <div class="stats">
          <div class="pill">Score: <span id="score">0</span></div>
          <div class="pill">High: <span id="high">0</span></div>
          <div class="pill">Level: <span id="level">1</span>/69</div>
          <div class="pill">Speed: <span id="speedLabel">Normal</span></div>
          <div class="pill" id="stateLabel">Ready</div>
        </div>
      </div>

      <div class="board-wrap">
        <canvas id="board" aria-label="Snake game area" role="img"></canvas>
        <div class="game-message" id="gameMessage" hidden><span></span></div>
      </div>

      <div id="a11y-announce" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"></div>
    </div>

    <div>
      <div class="controls">
        <div class="grid-spacer"></div>
        <button class="btn" data-dir="up">▲ Up</button>
        <div class="grid-spacer"></div>

        <button class="btn" data-dir="left">◀ Left</button>
        <button class="btn" id="pauseBtn">Start</button>
        <button class="btn" data-dir="right">▶ Right</button>

        <div class="grid-spacer"></div>
        <button class="btn" data-dir="down">▼ Down</button>
        <div class="grid-spacer"></div>

        <button class="btn utility" id="speedBtn" aria-label="Change speed">
          Speed: <span id="speedBtnLabel">Normal</span>
        </button>

        <button class="btn utility" id="restartBtn">Restart</button>
        <a class="btn utility" id="scoresBtn" href="/nakes/leaderboard.html" style="display:inline-block; text-decoration:none; text-align:center;">
          Leaderboard
        </a>
      </div>

      <details class="extras">
        <summary>Game help &amp; Prize Mode</summary>
        <div class="help">
          Keys: Arrows/WASD. Space/P = Pause. R = Restart. + / – = Speed.
          Wrap edges • 69 levels • Top-10 scoreboard • Offline PWA.
        </div>

        <div id="prize-root" style="margin:8px 0"></div>
      </details>
    </div>
  </div>

  <script>
    // ====== Config ======
    const BASE_SIZE=16, BOARD_RATIO=27/16, MAX_LEVEL=69, CELLS_PER_LEVEL=1, CELLS_PER_FOOD_FOR_LEVEL=5;
    const SPEEDS=[{label:"Chill",ms:160},{label:"Normal",ms:120},{label:"Snappy",ms:90},{label:"Turbo",ms:65}];
    let speedIndex = matchMedia("(pointer: coarse)").matches ? 0 : 1;

    // Cloudflare Worker API (existing global scoreboard)
    const GLOBAL_API = "https://snake-scoreboard.snake-scoreboard.workers.dev/api";

    // ====== DOM ======
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d', { alpha:false });
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const levelEl = document.getElementById('level');
    const speedLabel = document.getElementById('speedLabel');
    const stateLabel = document.getElementById('stateLabel');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    const speedBtnLabel = document.getElementById('speedBtnLabel');
    const announceEl = document.getElementById('a11y-announce');
    function announce(msg){ if(announceEl) announceEl.textContent = msg; }

    // ====== Game State ======
    let SIZE, COLS, nakes, previous, direction, food, score, high, alive, paused, ready, lastTick, level, foodsThisLevel;
    let turns=[], frame=0, progress=1;
    let LOGICAL_W=810, LOGICAL_H=480, DPR=1;
    const background=document.createElement('canvas');
    const bg=background.getContext('2d');
    const wrap=(n,size)=>((n%size)+size)%size;
    const delta=(a,b,size)=>{const d=b-a; return d>size/2?d-size:d<-size/2?d+size:d;};
    const message=document.getElementById('gameMessage');
    function status(label, hint=''){
      stateLabel.textContent=label;
      pauseBtn.textContent=label==='Playing'?'Pause':label==='Game Over'?'Play again':label==='Ready'?'Start':'Resume';
      message.hidden=!hint; message.firstElementChild.textContent=hint;
    }
    function wake(){ if(!frame && alive && !paused && !ready) frame=requestAnimationFrame(step); }

    // ====== Local scores (for offline) ======
    const STORAGE_HIGH="nakes_highscore_v1", STORAGE_BOARD="nakes_scoreboard_v1";
    function readBoard(){ try{const raw=localStorage.getItem(STORAGE_BOARD); return raw?JSON.parse(raw):[]}catch{return[]}}
    function writeBoard(list){ try{localStorage.setItem(STORAGE_BOARD, JSON.stringify(list))}catch{} }
    function addScoreToBoard(name,score,level){
      const list=readBoard(); list.push({name:(name||"Player").trim().slice(0,24)||"Player",score,level,ts:Date.now()});
      list.sort((a,b)=>b.score-a.score||b.ts-a.ts); writeBoard(list.slice(0,10));
    }
    async function submitGlobalScore(name, score, level){
      if(!GLOBAL_API) return;
      try{
        await fetch(`${GLOBAL_API}/submit`,{
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ name, score, level })
        });
      }catch{}
    }

    // ====== High score ======
    function loadHigh(){ try{high=Number(localStorage.getItem(STORAGE_HIGH))||0;}catch{high=0;} highEl.textContent=high; }
    function saveHigh(){ if(score>high){ high=score; highEl.textContent=high; try{localStorage.setItem(STORAGE_HIGH, String(high));}catch{} } }

    // ====== Level / Size ======
    function sizeForLevel(lv){ return BASE_SIZE + (lv-1)*CELLS_PER_LEVEL; }
    function applySizeVars(){ document.documentElement.style.setProperty('--size', String(SIZE)); }
    function setLevel(lv){
      level=Math.max(1,Math.min(MAX_LEVEL,lv));
      SIZE=sizeForLevel(level);
      COLS=Math.round(SIZE*BOARD_RATIO);
      applySizeVars();
      levelEl.textContent=level;
      speedLabel.textContent=SPEEDS[speedIndex].label;
      if (speedBtnLabel) speedBtnLabel.textContent = SPEEDS[speedIndex].label;
      foodsThisLevel=0;
      if(lv>1) announce("Level " + level + ".");
    }
    function maybeLevelUp(){
      if(level>=MAX_LEVEL) return;
      if(foodsThisLevel>=CELLS_PER_FOOD_FOR_LEVEL){
        // Unwrap a seam-crossing body before expanding the arena. Translate it
        // by whole old-board widths so adjacent segments remain adjacent.
        const old=SIZE, oldCols=COLS;
        const points=[{...nakes[0]}];
        for(let i=1;i<nakes.length;i++) points.push({x:points[i-1].x+delta(nakes[i-1].x,nakes[i].x,oldCols),y:points[i-1].y+delta(nakes[i-1].y,nakes[i].y,old)});
        setLevel(level+1);
        const seams={};
        // Insert the new row/column away from the snake's occupied links.
        for(const axis of ['x','y']){
          const extent=axis==='x'?oldCols:old;
          const used=new Set();
          for(let i=1;i<points.length;i++) if(points[i][axis]!==points[i-1][axis]) used.add(wrap(Math.max(points[i][axis],points[i-1][axis]),extent));
          let seam=0; while(seam<extent && used.has(seam)) seam++;
          seams[axis]=seam;
        }
        SIZE=old; COLS=oldCols;
        if(seams.x<oldCols && seams.y<old){
          SIZE=old+1;
          COLS=Math.round(SIZE*BOARD_RATIO);
          for(const axis of ['x','y']) if(seams[axis]!==0) for(const s of nakes) if(s[axis]>=seams[axis]) s[axis]+=axis==='x'?COLS-oldCols:1;
        }
        applySizeVars();
        previous=nakes.map(s=>({...s})); progress=1;
        layout();
        if(level%4===0 && speedIndex<SPEEDS.length-1){
          speedIndex++; speedLabel.textContent=SPEEDS[speedIndex].label;
          if (speedBtnLabel) speedBtnLabel.textContent = SPEEDS[speedIndex].label;
        }
      }
    }

    // ====== Layout: wide arena with square cells, crisp on DPR
    function layout(){
      const box=document.querySelector('.board-wrap');
      const ratio=COLS&&SIZE?COLS/SIZE:BOARD_RATIO;
      LOGICAL_H=Math.max(1,Math.min(box.clientWidth/ratio,box.clientHeight,1440/ratio));
      LOGICAL_W=LOGICAL_H*ratio;
      canvas.style.width=LOGICAL_W+'px'; canvas.style.height=LOGICAL_H+'px';
      DPR = Math.min(2,Math.max(1, window.devicePixelRatio || 1));
      canvas.width  = Math.max(1,Math.round(LOGICAL_W * DPR));
      canvas.height = Math.max(1,Math.round(LOGICAL_H * DPR));
      ctx.setTransform(canvas.width/LOGICAL_W, 0, 0, canvas.height/LOGICAL_H, 0, 0);
      if(SIZE){buildBackground(); draw(progress);}
    }
    window.addEventListener('resize', layout, {passive:true});
    window.addEventListener('orientationchange', layout, {passive:true});

    // ====== Core ======
    function reset(){
      setLevel(1);
      nakes=[
        {x:Math.floor(COLS/2), y:Math.floor(SIZE/2)},
        {x:Math.floor(COLS/2)-1, y:Math.floor(SIZE/2)},
        {x:Math.floor(COLS/2)-2, y:Math.floor(SIZE/2)}
      ];
      direction={x:1,y:0}; turns=[]; previous=nakes.map(s=>({...s})); progress=1;
      score=0; alive=true; paused=false; ready=true; lastTick=0;
      placeFood(); scoreEl.textContent=score;
      layout(); status('Ready','Press Start or a direction\nto begin');
      announce("Ready. Level 1.");
    }

    function placeFood(){
      const occupied=new Set(nakes.map(s=>s.y*COLS+s.x));
      if(occupied.size===COLS*SIZE){food=null; finishGame('Board cleared');return;}
      let pick=Math.floor(Math.random()*(COLS*SIZE-occupied.size));
      for(let i=0;i<COLS*SIZE;i++) if(!occupied.has(i) && pick--===0){food={x:i%COLS,y:Math.floor(i/COLS)};return;}
    }

    function setDirection(dx,dy){
      if(!alive || paused) return;
      const last=turns.at(-1)||direction;
      if(dx===-last.x && dy===-last.y) return;
      if(dx!==last.x || dy!==last.y){if(turns.length<2) turns.push({x:dx,y:dy});}
      if(ready){ready=false;status('Playing');wake();}
    }

    function buildBackground(){
      background.width=canvas.width; background.height=canvas.height;
      bg.setTransform(canvas.width/LOGICAL_W,0,0,canvas.height/LOGICAL_H,0,0);
      const w=LOGICAL_W,h=LOGICAL_H,c=h/SIZE;
      const gradient=bg.createRadialGradient(w*.45,h*.4,0,w*.5,h*.5,w*.65);
      gradient.addColorStop(0,'#293d29'); gradient.addColorStop(1,'#101b15');
      bg.fillStyle=gradient; bg.fillRect(0,0,w,h);
      bg.strokeStyle='#b2c9a015'; bg.lineWidth=.6; bg.beginPath();
      for(let i=1;i<COLS;i++){bg.moveTo(i*c,0);bg.lineTo(i*c,h);}
      for(let i=1;i<SIZE;i++){bg.moveTo(0,i*c);bg.lineTo(w,i*c);}
      bg.stroke();
      bg.fillStyle='#b5ca8b12';
      for(let i=0;i<350;i++){
        const x=((i*73.731)%100)/100*w,y=((i*39.137)%100)/100*h;
        bg.fillRect(x,y,Math.max(1,c*.055),Math.max(1,c*.055));
      }
    }

    // Render in cell units. Seam copies keep the snake continuous at wrap edges.
    function copies(x,y,paint){
      const xs=[x],ys=[y];
      if(x<1.5) xs.push(x+COLS); if(x>COLS-1.5) xs.push(x-COLS);
      if(y<1.5) ys.push(y+SIZE); if(y>SIZE-1.5) ys.push(y-SIZE);
      for(const px of xs) for(const py of ys) paint(px,py);
    }
    function line(x,y,dx,dy,width,color){
      ctx.lineWidth=width;ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy);ctx.stroke();
    }
    function oval(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
    function draw(alpha=1){
      ctx.drawImage(background,0,0,LOGICAL_W,LOGICAL_H);
      const c=LOGICAL_H/SIZE;
      ctx.save();ctx.scale(c,c);ctx.lineCap='round';ctx.lineJoin='round';
      // Bright fruit stays readable even at the highest levels.
      if(food){const fx=food.x+.5,fy=food.y+.5;
      oval(fx,fy+.12,.42,.34,'#101410');oval(fx,fy,.35,.35,'#de4e42');
      oval(fx-.1,fy-.12,.13,.09,'#ffab82');line(fx,fy-.26,.08,-.16,.075,'#dfc78c');
      oval(fx+.16,fy-.33,.13,.06,'#a5d477');}
      const pts=nakes.map((s,i)=>{
        const from=previous[i]||s;
        return {x:wrap(from.x+delta(from.x,s.x,COLS)*alpha+.5,COLS),y:wrap(from.y+delta(from.y,s.y,SIZE)*alpha+.5,SIZE)};
      });
      // Dark outline, overlapping tapered links, then a dorsal scale pattern.
      for(let pass=0;pass<2;pass++) for(let i=pts.length-1;i>0;i--){
        const a=pts[i],b=pts[i-1],dx=delta(a.x,b.x,COLS),dy=delta(a.y,b.y,SIZE);
        const width=.25+.51*Math.min(1,(pts.length-i)/4);
        copies(a.x,a.y,(x,y)=>line(x,y,dx,dy,width+(pass===0?.12:0),pass===0?'#111e13':'#779a48'));
      }
      for(let i=pts.length-1;i>0;i--){
        const a=pts[i],b=pts[i-1];
        copies(a.x,a.y,(x,y)=>{
          const dx=delta(a.x,b.x,COLS),dy=delta(a.y,b.y,SIZE);
          oval(x+dx*.4,y+dy*.4,.15,.15,'#3c6034');
          if(c>=12) oval(x+dx*.4-.055,y+dy*.4-.055,.055,.055,'#a6bf6c');
        });
      }
      const h=pts[0];
      copies(h.x,h.y,(x,y)=>{
        ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(direction.y,direction.x));
        oval(0,0,.49,.38,'#142414');oval(.035,0,.43,.33,'#97b65b');
        oval(.15,0,.25,.23,'#aac77a');
        for(const side of [-1,1]){
          oval(.15,side*.24,.095,.075,'#e9c46a');oval(.18,side*.24,.027,.058,'#111811');
          oval(.35,side*.10,.025,.025,'#263b23');
        }
        ctx.restore();
      });
      ctx.restore();
    }

    function finishGame(title='Game over'){
      alive=false;
      status('Game Over',`${title} · Score ${score}\nPress Play again or R`);
      saveHigh(); progress=1; draw(1);
      announce(`${title}. Score: ${score}. Level: ${level}.`);
      const finalScore=score, finalLevel=level;
      setTimeout(()=>{
        const name=prompt(`${title}! Enter your name for the leaderboard:`, '')||'Player';
        addScoreToBoard(name, finalScore, finalLevel);
        submitGlobalScore(name, finalScore, finalLevel);
        window.__sendPrize?.(finalLevel);
      },20);
    }

    function step(ts){
      frame=0;
      if(!alive || paused || ready) return;
      if(!lastTick) lastTick=ts-progress*SPEEDS[speedIndex].ms;
      const interval=SPEEDS[speedIndex].ms;
      if(ts-lastTick>=interval){
        // Preserve normal frame timing, but never catch up a long stall with
        // several unseen moves.
        lastTick=ts-lastTick>=2*interval?ts:lastTick+interval;
        direction=turns.shift()||direction;

        const head=nakes[0];
        let nx=head.x+direction.x, ny=head.y+direction.y;

        if(nx<0) nx=COLS-1; else if(nx>=COLS) nx=0;
        if(ny<0) ny=SIZE-1; else if(ny>=SIZE) ny=0;

        const eating=nx===food.x && ny===food.y;
        if(nakes.some((s,i)=>s.x===nx && s.y===ny && (eating || i<nakes.length-1))){
          finishGame();
          return;
        }
        previous=nakes.slice();
        nakes.unshift({x:nx,y:ny});
        if(eating){
          score+=1;
          foodsThisLevel+=1;
          scoreEl.textContent=score;
          saveHigh();
          maybeLevelUp();
          placeFood();
          if(!alive)return;
        }else{
          nakes.pop();
        }
      }

      progress=Math.min(1,(ts-lastTick)/SPEEDS[speedIndex].ms);
      draw(progress);
      wake();
    }

    // ====== Input (keys + buttons + swipe) ======
    window.addEventListener('keydown', (e)=>{
      if(e.target.matches?.('input,textarea,select,[contenteditable]') || e.ctrlKey || e.metaKey || e.altKey) return;
      const k=e.key.toLowerCase();
      if(e.repeat && [' ','p','r','+','=','-','_'].includes(k)) return;
      if(k===' ' && e.target.matches?.('button,a')) return;
      let handled=false;

      if(k==='arrowup'||k==='w'){ setDirection(0,-1); handled=true; }
      else if(k==='arrowdown'||k==='s'){ setDirection(0,1); handled=true; }
      else if(k==='arrowleft'||k==='a'){ setDirection(-1,0); handled=true; }
      else if(k==='arrowright'||k==='d'){ setDirection(1,0); handled=true; }
      else if(k===' '||k==='p'){ togglePause(); handled=true; }
      else if(k==='r'){ reset(); handled=true; }
      else if(k==='+'||k==='='){ changeSpeed(1); handled=true; }
      else if(k==='-'||k==='_'){ changeSpeed(-1); handled=true; }

      if(handled) e.preventDefault();
    }, {passive:false});

    document.querySelectorAll('[data-dir]').forEach(btn=>{
      const turn=()=>{
        const d=btn.getAttribute('data-dir');
        if(d==='up') setDirection(0,-1);
        if(d==='down') setDirection(0,1);
        if(d==='left') setDirection(-1,0);
        if(d==='right') setDirection(1,0);
      };
      btn.addEventListener('pointerdown', e=>{if(e.button===0){e.preventDefault();turn();}});
      btn.addEventListener('click', e=>{if(e.detail===0) turn();});
    });

    if (pauseBtn) pauseBtn.addEventListener('click', togglePause);

    // swipe on canvas
    (function(){
      const el=canvas;
      let startX=0,startY=0,active=false;
      const minDist=18;

      el.addEventListener('touchstart', e=>{
        const t=e.changedTouches[0];
        startX=t.clientX;
        startY=t.clientY;
        active=true;
      }, {passive:true});

      el.addEventListener('touchmove', e=>{
        if(!active) return;
        const t=e.changedTouches[0];
        const dx=t.clientX-startX, dy=t.clientY-startY;

        if(Math.max(Math.abs(dx),Math.abs(dy))<minDist) return;
        startX=t.clientX; startY=t.clientY;

        if(Math.abs(dx)>Math.abs(dy)){
          setDirection(dx>0?1:-1,0);
        } else {
          setDirection(0,dy>0?1:-1);
        }
      }, {passive:true});
      el.addEventListener('touchend', ()=>{active=false;}, {passive:true});
      el.addEventListener('touchcancel', ()=>{active=false;}, {passive:true});
    })();

    function togglePause(){
      if(!alive){reset();return;}
      if(ready){ready=false;status('Playing');wake();return;}
      paused=!paused;
      lastTick=0;
      status(paused?'Paused':'Playing',paused?'Paused\nPress Resume or Space':'');
      if(paused){cancelAnimationFrame(frame);frame=0;}else wake();
      announce(paused?"Game paused.":"Game resumed.");
    }

    function changeSpeed(delta){
      const prev=speedIndex;
      speedIndex=Math.max(0,Math.min(SPEEDS.length-1,speedIndex+delta));

      if(speedIndex!==prev){
        lastTick=0;
        speedLabel.textContent=SPEEDS[speedIndex].label;
        if (speedBtnLabel) speedBtnLabel.textContent = SPEEDS[speedIndex].label;
      }
    }

    if (speedBtn) speedBtn.addEventListener('click', ()=>changeSpeed(speedIndex===SPEEDS.length-1?1-SPEEDS.length:1));
    document.getElementById('restartBtn').addEventListener('click',reset);

    // ====== Boot ======
    function boot(){
      layout();
      loadHigh();
      reset();
      if(window.ResizeObserver) new ResizeObserver(layout).observe(document.querySelector('.board-wrap'));
    }

    window.addEventListener('load', boot, {passive:true});
    document.addEventListener('visibilitychange', ()=>{ if(document.hidden && alive && !paused && !ready) togglePause(); }, {passive:true});
    window.addEventListener('resize', ()=>{ lastTick=0; }, {passive:true});

    // ====== Service worker ======
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=> navigator.serviceWorker.register('/nakes/service-worker.js'));
    }
  </script>

  <script type="module">
    import { mountPrizeWidget, prizeFinish } from "/nakes/prize.js";

    mountPrizeWidget("#prize-root");

    window.__sendPrize = async (finalLevel) => {
      try {
        const res = await prizeFinish(finalLevel);
        console.log("[Prize] result:", res);
      } catch (e) {
        console.warn("[Prize] error:", e);
      }
    };
  </script>
</body>
