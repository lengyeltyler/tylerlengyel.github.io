<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Art - Tyler Lengyel</title>

  <meta
    name="description"
    content="A small gallery archive from Tyler Lengyel."
  />

  <meta name="theme-color" content="#050505" />

  <link rel="stylesheet" href="/assets/site-theme.css" />

  <style>
    .art-hero {
      display: grid;
      gap: 14px;
    }

    .art-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .gallery-panel {
      padding: 0;
      overflow: hidden;
    }

    .gallery-heading {
      padding: 22px 22px 0;
    }

    .gallery-heading h2 {
      margin: 0;
      font: 700 1.35rem/1.2 var(--font-ui);
    }

    .gallery-heading p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .pepe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      padding: 22px;
    }

    .pepe-card {
      display: grid;
      gap: 9px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--paper-soft);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition:
        border-color 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
    }

    .pepe-card:hover,
    .pepe-card:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent-strong);
      box-shadow: 0 16px 34px var(--shadow-strong);
    }

    .pepe-card img {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: #111111;
    }

    .pepe-card span {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font: 700 0.84rem/1.2 var(--font-ui);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(5, 5, 5, 0.86);
    }

    .lightbox[hidden] {
      display: none;
    }

    .lightbox-panel {
      width: min(980px, 100%);
      max-height: calc(100vh - 48px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      color: #faf7f0;
    }

    .lightbox-bar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      font: 700 1rem/1.2 var(--font-ui);
    }

    .lightbox-bar button {
      min-width: 44px;
      min-height: 36px;
      border: 1px solid rgba(250, 247, 240, 0.22);
      border-radius: 999px;
      background: rgba(250, 247, 240, 0.1);
      color: #faf7f0;
      cursor: pointer;
    }

    .lightbox img {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      justify-self: center;
      object-fit: contain;
      border-radius: var(--radius-md);
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
    }

    body.lightbox-open {
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .pepe-grid {
        grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
        gap: 10px;
        padding: 14px;
      }

      .gallery-heading {
        padding: 18px 16px 0;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="site-frame">
      <a class="site-brand" href="/">Tyler Lengyel</a>

      <nav class="site-tabs" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/linearA/">Linear A</a>
        <a href="/createPhil/">createPhil</a>
        <a href="/nakes/">nakes</a>
        <a href="/art/" aria-current="page">Art</a>
        <a href="/svg-editor/">SVG Editor</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="page-shell is-wide">
    <div class="page-stack">
      <section class="paper-panel art-hero">
        <p class="eyebrow">Art</p>
        <h1>Art</h1>
        <p class="lede">
          A small local gallery archive. The first room is Pepe.
        </p>
        <div class="art-tabs" aria-label="Art sections">
          <a class="link-button is-active" href="#pepe">Pepe</a>
        </div>
      </section>

      <section id="pepe" class="surface-card gallery-panel" aria-labelledby="pepe-heading">
        <div class="gallery-heading">
          <h2 id="pepe-heading">Pepe</h2>
          <p>Movie-poster-style Pepe variations from the local archive.</p>
        </div>
        <div class="pepe-grid" data-pepe-gallery></div>
      </section>
    </div>
  </main>

  <div class="lightbox" data-lightbox hidden>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <div class="lightbox-bar">
        <span id="lightbox-title" data-lightbox-title></span>
        <button type="button" data-lightbox-close aria-label="Close image preview">Close</button>
      </div>
      <img data-lightbox-image alt="" />
    </div>
  </div>

  <script src="/art/pepe-gallery.js"></script>
</body>
</html>
