<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Art - Tyler Lengyel</title>

  <meta
    name="description"
    content="A small gallery archive from Tyler Lengyel."
  />

  <meta name="theme-color" content="#EAE7DF" />
  <script src="/assets/site-shell.js"></script>
  <link rel="stylesheet" href="/assets/site-theme.css" />

  <style>
    .art-page .paper-panel {
      display: grid;
      gap: 18px;
      background: var(--paper);
      border-color: var(--line-strong);
    }

    .art-page .lede {
      max-width: 46rem;
    }

    .art-page h1,
    .art-page .paper-panel .eyebrow {
      color: var(--accent-ink);
    }

    .art-nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .gallery-panel {
      display: grid;
      gap: 18px;
      background: var(--contrast);
      border: 2px solid var(--line-strong);
      box-shadow: 6px 6px 0 var(--shadow-pixel);
      color: var(--on-contrast);
    }

    .gallery-heading {
      display: grid;
      gap: 5px;
    }

    .gallery-heading h2,
    .gallery-heading p {
      margin: 0;
    }

    .gallery-heading h2,
    .gallery-heading .eyebrow {
      color: var(--accent);
    }

    .gallery-heading .section-note {
      color: var(--on-contrast-muted);
    }

    .gallery-meta {
      color: var(--on-contrast-muted);
      font: 700 0.76rem/1.3 var(--font-ui);
    }

    .pepe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    .pepe-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 100%;
      padding: 12px;
      border: 2px solid var(--line-strong);
      border-radius: 0;
      background: var(--paper);
      box-shadow: 4px 4px 0 #090b0d;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition:
        border-color 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
    }

    .pepe-card:hover,
    .pepe-card:focus-visible {
      transform: translate(2px, 2px);
      border-color: var(--accent);
      box-shadow: 2px 2px 0 #090b0d;
    }

    .pepe-card img {
      width: 100%;
      aspect-ratio: 4 / 5;
      display: block;
      object-fit: cover;
      border-radius: 0;
      background: var(--contrast-raised);
      transition: transform 180ms ease;
    }

    .pepe-card:hover img,
    .pepe-card:focus-visible img {
      transform: scale(1.012);
    }

    .pepe-card span {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: var(--ink);
      font: 600 0.86rem/1.3 var(--font-ui);
    }

    .art-nav .link-button {
      background: var(--contrast);
      border: 2px solid var(--line-strong);
      color: var(--accent);
      box-shadow: 3px 3px 0 var(--shadow-pixel);
    }

    .art-nav .link-button:hover,
    .art-nav .link-button:focus-visible {
      transform: translate(2px, 2px);
      border-color: var(--accent);
      box-shadow: 1px 1px 0 var(--shadow-pixel);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(177, 230, 255, 0.16), transparent 34%),
        rgba(5, 5, 5, 0.86);
      backdrop-filter: blur(10px);
    }

    .lightbox[hidden] {
      display: none;
    }

    .lightbox-panel {
      width: min(980px, 100%);
      max-height: calc(100vh - 48px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      color: var(--on-contrast);
    }

    .lightbox-bar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      font: 700 1rem/1.2 var(--font-ui);
    }

    .lightbox-bar button {
      min-width: 44px;
      min-height: 36px;
      border: 2px solid rgba(242, 240, 234, 0.34);
      border-radius: 0;
      background: rgba(242, 240, 234, 0.1);
      color: var(--on-contrast);
      cursor: pointer;
      font: 700 0.9rem/1.1 var(--font-ui);
      transition:
        background-color 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .lightbox-bar button:hover,
    .lightbox-bar button:focus-visible {
      transform: translate(1px, 1px);
      border-color: var(--accent);
      background: rgba(177, 230, 255, 0.16);
    }

    .lightbox img {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      justify-self: center;
      object-fit: contain;
      border: 2px solid rgba(177, 230, 255, 0.3);
      border-radius: 0;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
    }

    body.lightbox-open {
      overflow: hidden;
    }

    @media (max-width: 760px) {
      .pepe-grid {
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 10px;
      }

      .pepe-card {
        padding: 9px;
      }
    }
  </style>
</head>

<body class="art-page">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header data-site-header="art"></header>

  <main id="main-content" class="page-shell is-wide">
    <div class="page-stack">
      <section class="paper-panel">
        <p class="eyebrow">Art</p>
        <h1>Art</h1>
        <p class="lede">
          A working archive of image experiments. For now, this room belongs entirely to Pepe.
        </p>
        <nav class="art-nav" aria-label="Art sections">
          <a class="link-button is-active" href="#pepe">Pepe</a>
        </nav>
      </section>

      <section id="pepe" class="surface-card gallery-panel" aria-labelledby="pepe-heading">
        <div class="gallery-heading">
          <p class="eyebrow">Gallery</p>
          <h2 id="pepe-heading">Pepe archive</h2>
          <p class="section-note">Movie-poster-style variations collected as one continuous body of work.</p>
          <p class="gallery-meta">77 images</p>
        </div>
        <div class="pepe-grid" data-pepe-gallery></div>
      </section>
    </div>
  </main>

  <div class="lightbox" data-lightbox hidden>
    <div class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <div class="lightbox-bar">
        <span id="lightbox-title" data-lightbox-title></span>
        <button type="button" data-lightbox-close aria-label="Close image preview">Close</button>
      </div>
      <img data-lightbox-image alt="" />
    </div>
  </div>

  <script src="/art/pepe-gallery.js"></script>
</body>
</html>
