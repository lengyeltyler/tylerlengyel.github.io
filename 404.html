<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Not Found</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#EAE7DF" />
  <script src="/assets/site-shell.js"></script>
  <link rel="stylesheet" href="/assets/site-theme.css" />
  <script>
    (function () {
      var path = window.location.pathname || "/";
      var normalizedPath = path.toLowerCase();
      var redirects = {
        "/createphil": "/createPhil/",
        "/createphil/": "/createPhil/",
        "/linear-a": "/linearA/index.html",
        "/linear-a/": "/linearA/index.html"
      };

      if (redirects[normalizedPath]) {
        window.location.replace(redirects[normalizedPath]);
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header data-site-header=""></header>
  <main id="main-content" class="page-shell center-panel">
    <section class="paper-panel" data-writing-root>
      <p class="eyebrow">404</p>
      <h1>Page not found.</h1>
      <p class="lede">
        The page you requested is not available here, or the path has changed.
      </p>
      <p style="margin: 18px 0 0;">
        <a class="link-button" href="/">Back to Home</a>
      </p>
    </section>
  </main>

  <script defer src="/assets/site-theme.js"></script>
</body>
</html>
