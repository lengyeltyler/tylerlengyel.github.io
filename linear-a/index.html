<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Redirecting to Linear A...</title>

  <meta http-equiv="refresh" content="0; url=/linearA/index.html" />

  <link rel="canonical" href="https://tylerlengyel.com/linearA/index.html" />

  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#EAE7DF" />
  <script src="/assets/site-shell.js"></script>

  <link rel="stylesheet" href="/assets/site-theme.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        135deg,
        #f2f0ea 0%,
        #e8e3da 100%
      );

      color: #312d38;
      font-family: Inter, sans-serif;
    }

    .redirect-panel {
      width: min(680px, calc(100vw - 32px));

      padding: 42px;

      border-radius: 28px;

      background: linear-gradient(
        135deg,
        #f7f5f0 0%,
        #e9e1f2 100%
      );

      border: 1px solid #b8aec2;

      box-shadow:
        0 24px 60px rgba(0,0,0,0.35);

      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 5vw, 3.25rem);
      line-height: 1.05;
    }

    p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.7;
      opacity: 0.95;
    }

    .redirect-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      margin-top: 28px;

      padding: 12px 18px;

      border-radius: 999px;

      background: #1d1b20;

      color: #b1e6ff;
      text-decoration: none;
      font-weight: 700;

      border: 1px solid rgba(177,230,255,0.42);

      transition:
        transform 0.18s ease,
        background 0.18s ease;
    }

    .redirect-link:hover {
      transform: translateY(-2px);
      background: #29262d;
    }
  </style>

  <script>
    window.location.replace("/linearA/index.html");
  </script>
</head>

<body>

  <main class="redirect-panel">

    <p style="margin-bottom:10px; opacity:0.78;">
      Redirect
    </p>

    <h1>Redirecting to Linear A</h1>

    <p>
      If the redirect does not automatically complete,
      use the button below.
    </p>

    <a
      class="redirect-link"
      href="/linearA/index.html"
    >
      Open Linear A
    </a>

  </main>

</body>
</html>
