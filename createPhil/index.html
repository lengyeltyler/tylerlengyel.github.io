<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>createPhil - Tyler Lengyel</title>
  <meta name="theme-color" content="#faf7f0" />
  <link rel="stylesheet" href="/assets/site-theme.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="site-frame">
      <a class="site-brand" href="/">Tyler Lengyel</a>
      <nav class="site-tabs" aria-label="Primary">
        <a href="/">Home</a>
        <a href="/linearA/">Linear A</a>
        <a href="/createPhil/" aria-current="page">createPhil</a>
        <a href="/nakes/">nakes</a>
        <a href="/svg-editor/">SVG Editor</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="page-shell is-wide frame-shell">
    <section class="paper-panel" data-writing-root>
      <p class="eyebrow">Legacy Tool</p>
      <h1>createPhil</h1>
      <p class="lede">
        The original createPhil environment is preserved below in an embedded frame so the legacy
        workflow stays available without changing the underlying tool.
      </p>
      <p style="margin: 18px 0 0;">
        <button class="link-button" data-motion-toggle type="button">Writing motion: on</button>
      </p>
    </section>

    <section class="frame-panel" data-no-reveal>
      <iframe
        id="createPhilFrame"
        class="embedded-frame"
        src="https://lengyeltyler.github.io/createPhil/"
        title="createPhil"
        loading="eager"
        referrerpolicy="no-referrer">
      </iframe>
    </section>
  </main>

  <script defer src="/assets/site-theme.js"></script>
  <script>
    const createPhilFrame = document.getElementById("createPhilFrame");
    const TRUSTED_CREATEPHIL_ORIGIN = "https://lengyeltyler.github.io";

    window.addEventListener("message", (event) => {
      if (event.origin !== TRUSTED_CREATEPHIL_ORIGIN) return;
      if (createPhilFrame && createPhilFrame.contentWindow && event.source !== createPhilFrame.contentWindow) return;

      const message = event.data || {};
      if (message.source === "createPhil" && message.kind === "download-svg") {
        try {
          const blob = new Blob([message.data], {
            type: message.mime || "image/svg+xml;charset=utf-8"
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = message.filename || "download.svg";
          link.rel = "noopener";
          document.body.appendChild(link);
          link.click();
          setTimeout(() => {
            URL.revokeObjectURL(url);
            link.remove();
          }, 0);
        } catch (error) {
          console.warn("Top-level SVG download failed:", error);
        }
      }
    });
  </script>
</body>
</html>
