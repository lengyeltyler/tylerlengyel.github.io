<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVG Editor Local Runtime</title>
  <link rel="stylesheet" href="./illustrator-lite.css?v=20261126-arrows" />
</head>
<body>
  <div class="editor-shell">
    <header class="toolbar" role="toolbar" aria-label="Editor toolbar">
      <div class="workspace-name"><span>Ph</span> PhilAstrator <small>Vector studio</small></div>
      <div class="toolbar-actions">
        <button type="button" id="new-doc-btn" class="text-button">New</button>
        <button type="button" id="import-svg-btn" class="text-button">Open SVG</button><input type="file" id="import-svg-input" accept=".svg,image/svg+xml" hidden />
        <button type="button" id="open-project-btn" class="text-button">Open project</button><input id="project-input" type="file" accept=".phstudio,.json,application/json" hidden />
        <button type="button" id="save-project-btn" class="text-button">Save project</button>
        <button type="button" id="duplicate-btn" class="text-button">Duplicate</button>
        <button type="button" id="snap-toggle-btn" class="text-button is-active">Snap</button>
        <button type="button" id="grid-toggle-btn" class="text-button">Grid</button>
        <button type="button" id="undo-btn" class="text-button">Undo</button>
        <button type="button" id="redo-btn" class="text-button">Redo</button>
        <button type="button" id="download-svg-btn" class="text-button">Download SVG</button>
        <button type="button" id="download-png-btn" class="text-button">PNG</button>
        <button type="button" id="copy-svg-btn" class="text-button">Copy SVG</button>
      </div>
    </header>

    <div class="editor-body">
      <nav class="tool-group tool-rail" id="tool-group" aria-label="Drawing tools">
        <button type="button" class="tool-button is-active" data-tool="select" title="Selection (V)" aria-label="Selection (V)"><svg viewBox="0 0 24 24"><path d="M5 3l15 12-8 1-4 6z" fill="currentColor" stroke="none"/></svg><span>V</span></button>
        <button type="button" class="tool-button" data-tool="direct" title="Direct selection (A)" aria-label="Direct selection (A)"><svg viewBox="0 0 24 24"><path d="M5 3l15 12-8 1-4 6z"/></svg><span>A</span></button>
        <button type="button" class="tool-button" data-tool="pen" title="Pen (P)" aria-label="Pen (P)"><svg viewBox="0 0 24 24"><path d="M12 3l7 12-7 6-7-6zM12 3v10m-4 8h8"/></svg><span>P</span></button>
        <button type="button" class="tool-button" data-tool="pencil" title="Pencil (N)" aria-label="Pencil (N)"><svg viewBox="0 0 24 24"><path d="M3 21l3-8L17 2l5 5L11 18zM6 13l5 5m3-13l5 5"/></svg><span>N</span></button>
        <button type="button" class="tool-button" data-tool="rect" title="Rectangle (M)" aria-label="Rectangle (M)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/></svg><span>M</span></button>
        <button type="button" class="tool-button" data-tool="ellipse" title="Ellipse (L)" aria-label="Ellipse (L)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg><span>L</span></button>
        <button type="button" class="tool-button" data-tool="polygon" title="Polygon" aria-label="Polygon"><svg viewBox="0 0 24 24"><path d="M12 3l9 5v8l-9 5-9-5V8z"/></svg></button>
        <button type="button" class="tool-button" data-tool="star" title="Star" aria-label="Star"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1z"/></svg></button>
        <button type="button" class="tool-button" data-tool="line" title="Line (\\)" aria-label="Line"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg><span>\</span></button>
        <button type="button" class="tool-button" data-tool="text" title="Type (T)" aria-label="Type (T)"><svg viewBox="0 0 24 24"><path d="M4 6h16M12 6v14M8 20h8"/></svg><span>T</span></button>
        <button type="button" class="tool-button" data-tool="hand" title="Hand (H or Space)" aria-label="Hand (H)"><svg viewBox="0 0 24 24"><path d="M7 12V6a2 2 0 014 0v6-8a2 2 0 014 0v8-5a2 2 0 014 0v8c0 4-3 7-7 7-3 0-5-2-6-5l-3-5a2 2 0 013-2z"/></svg><span>H</span></button>
        <button type="button" class="tool-button" data-tool="zoom" title="Zoom (Z); Alt to zoom out" aria-label="Zoom (Z)"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6M7 10h6m-3-3v6"/></svg><span>Z</span></button>
      </nav>
      <aside class="panel" aria-label="Inspector panel">
        <h2>Document</h2>
        <div class="field-row">
          <label for="doc-width-input">Width</label>
          <input id="doc-width-input" type="number" min="64" max="10000" step="1" value="1200" />
        </div>
        <div class="field-row">
          <label for="doc-height-input">Height</label>
          <input id="doc-height-input" type="number" min="64" max="10000" step="1" value="800" />
        </div>
        <div class="field-row"><label for="grid-size-input">Grid spacing</label><input id="grid-size-input" type="number" min="2" max="500" value="20" /></div>
        <label class="check-row"><input id="grid-snap-input" type="checkbox" /> Snap to grid</label>
        <h2>Style</h2>
        <div class="field-row">
          <label for="fill-input">Fill</label>
          <input id="fill-input" type="color" value="#90caf9" />
          <button type="button" id="fill-none-btn" class="none-button" title="No fill">None</button>
        </div>
        <div class="field-row">
          <label for="stroke-input">Stroke</label>
          <input id="stroke-input" type="color" value="#1976d2" />
          <button type="button" id="stroke-none-btn" class="none-button" title="No stroke">None</button>
        </div>
        <div class="field-row">
          <label for="stroke-width-input">Stroke width</label>
          <input id="stroke-width-input" type="number" min="0" max="64" step="0.5" value="2" />
        </div>
        <div class="field-row">
          <label for="opacity-input">Opacity</label>
          <input id="opacity-input" type="range" min="0" max="1" step="0.01" value="1" />
        </div>
        <div class="swatches" id="swatches" aria-label="Color swatches"></div>
        <details class="inspector-details"><summary>Gradient</summary>
          <div class="field-row"><label for="gradient-type-input">Fill type</label><select id="gradient-type-input"><option value="none">Solid</option><option value="linear">Linear</option><option value="radial">Radial</option></select></div>
          <div class="gradient-sample" id="gradient-sample"></div>
          <div class="field-row"><label for="gradient-angle-input">Angle</label><input id="gradient-angle-input" type="number" min="-360" max="360" value="0" /></div>
          <div id="gradient-stops" class="gradient-stops"></div><button type="button" id="gradient-add-stop" class="text-button">Add stop</button>
        </details>
        <details class="inspector-details"><summary>Stroke</summary>
          <div class="field-row"><label for="stroke-cap-input">Cap</label><select id="stroke-cap-input"><option>butt</option><option>round</option><option>square</option></select></div>
          <div class="field-row"><label for="stroke-join-input">Join</label><select id="stroke-join-input"><option>miter</option><option>round</option><option>bevel</option></select></div>
          <div class="field-row"><label for="stroke-dash-input">Dash pattern</label><input id="stroke-dash-input" type="text" placeholder="6, 4" /></div>
        </details>
        <div class="field-row" id="corner-properties" hidden><label for="corner-radius-input">Corner radius</label><input id="corner-radius-input" type="number" min="0" value="0" /></div>
        <div class="field-row"><label for="shape-sides-input">Polygon sides / star points</label><input id="shape-sides-input" type="number" min="3" max="32" value="5" /></div>
        <div id="text-properties" hidden><h2>Type</h2><textarea id="text-content-input" rows="3" aria-label="Text content"></textarea><div class="field-row"><label for="font-size-input">Size</label><input id="font-size-input" type="number" min="6" max="500" value="36" /></div><div class="field-row"><label for="font-family-input">Font</label><select id="font-family-input"><option>Arial</option><option>Georgia</option><option>Helvetica</option><option>Times New Roman</option><option>Courier New</option></select></div><div class="field-row"><label for="font-weight-input">Weight</label><select id="font-weight-input"><option value="400">Regular</option><option value="700">Bold</option></select></div><div class="field-row"><label for="font-style-input">Style</label><select id="font-style-input"><option>normal</option><option>italic</option></select></div><div class="field-row"><label for="text-align-input">Align</label><select id="text-align-input"><option value="start">Left</option><option value="middle">Center</option><option value="end">Right</option></select></div><div class="field-row"><label for="letter-spacing-input">Tracking</label><input id="letter-spacing-input" type="number" min="-20" max="100" step="0.5" value="0" /></div><div class="field-row"><label for="line-height-input">Leading</label><input id="line-height-input" type="number" min="0.5" max="4" step="0.1" value="1.2" /></div></div>
        <h2>Transform</h2>
        <div class="field-row">
          <label for="transform-x-input">X</label>
          <input id="transform-x-input" type="number" step="0.5" value="0" />
        </div>
        <div class="field-row">
          <label for="transform-y-input">Y</label>
          <input id="transform-y-input" type="number" step="0.5" value="0" />
        </div>
        <div class="field-row">
          <label for="transform-w-input">W</label>
          <input id="transform-w-input" type="number" min="1" step="0.5" value="1" />
        </div>
        <div class="field-row">
          <label for="transform-h-input">H</label>
          <input id="transform-h-input" type="number" min="1" step="0.5" value="1" />
        </div>
        <div class="field-row">
          <label for="transform-rotate-input">Rotate</label>
          <input id="transform-rotate-input" type="number" step="0.5" value="0" />
        </div>
        <h2>Arrange</h2>
        <div class="field-row"><label for="align-target-input">Align to</label><select id="align-target-input"><option value="selection">Selection</option><option value="artboard">Artboard</option></select></div>
        <div class="action-grid action-grid-three">
          <button type="button" id="align-left-btn" class="text-button">Left</button>
          <button type="button" id="align-hcenter-btn" class="text-button">H-Center</button>
          <button type="button" id="align-right-btn" class="text-button">Right</button>
        </div>
        <div class="action-grid action-grid-three">
          <button type="button" id="align-top-btn" class="text-button">Top</button>
          <button type="button" id="align-vcenter-btn" class="text-button">V-Center</button>
          <button type="button" id="align-bottom-btn" class="text-button">Bottom</button>
        </div>
        <div class="action-grid action-grid-two">
          <button type="button" id="distribute-h-btn" class="text-button">Distribute H</button>
          <button type="button" id="distribute-v-btn" class="text-button">Distribute V</button>
        </div>
        <h2>Boolean</h2>
        <div class="action-grid action-grid-three">
          <button type="button" id="boolean-unite-btn" class="text-button">Unite</button>
          <button type="button" id="boolean-subtract-btn" class="text-button">Subtract</button>
          <button type="button" id="boolean-intersect-btn" class="text-button">Intersect</button>
        </div>
        <div class="action-grid action-grid-two"><button type="button" id="compound-btn" class="text-button">Make compound</button><button type="button" id="release-compound-btn" class="text-button">Release</button></div>
        <p class="panel-note" id="selection-summary">No selection</p>
      </aside>

      <main class="canvas-shell" aria-label="Drawing area">
        <div class="canvas-topline"><div class="artboard-actions"><label for="artboard-select">Artboard</label><select id="artboard-select" aria-label="Active artboard"></select><button type="button" id="add-artboard-btn" class="text-button" title="Add artboard" aria-label="Add artboard">+</button><button type="button" id="duplicate-artboard-btn" class="text-button" title="Duplicate artboard">Duplicate</button><button type="button" id="rename-artboard-btn" class="text-button">Rename</button><button type="button" id="delete-artboard-btn" class="text-button" aria-label="Delete artboard">−</button></div><span id="artboard-size">1200 × 800 px</span></div>
        <svg id="editor-canvas" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" tabindex="0">
          <defs id="paint-defs"></defs>
          <defs><pattern id="studio-grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse"><path id="studio-grid-path" d="M 20 0 H 0 V 20" fill="none" stroke="#a5b7c8" stroke-width="0.5" /></pattern></defs>
          <rect id="canvas-bg" x="0" y="0" width="1200" height="800" fill="#ffffff" />
          <rect id="studio-grid" x="0" y="0" width="1200" height="800" fill="url(#studio-grid-pattern)" pointer-events="none" visibility="hidden" />
          <g id="scene-root"></g>
          <g id="overlay-root"></g>
        </svg>
        <div class="canvas-controls"><button type="button" id="zoom-out-btn" class="text-button" aria-label="Zoom out">−</button><output id="zoom-label">100%</output><button type="button" id="zoom-in-btn" class="text-button" aria-label="Zoom in">+</button><button type="button" id="fit-btn" class="text-button">Fit artboard</button><button type="button" id="actual-size-btn" class="text-button">100%</button></div>
      </main>

      <aside class="panel layers-panel" aria-label="Layers panel">
        <div class="layers-heading"><h2>Layers</h2><button type="button" id="expand-layers-btn" class="layer-icon" title="Expand all groups" aria-label="Expand all groups"><svg viewBox="0 0 16 16"><path d="m4 3 4 4 4-4M4 8l4 4 4-4"/></svg></button><button type="button" id="collapse-layers-btn" class="layer-icon" title="Collapse all groups" aria-label="Collapse all groups"><svg viewBox="0 0 16 16"><path d="m4 7 4-4 4 4M4 12l4-4 4 4"/></svg></button></div>
        <div class="layers-column-header"><span>Eye</span><span>Lock</span><span>Name</span><span>Target</span></div>
        <div id="layers-list" class="layers-list" role="tree" aria-label="Artwork layer hierarchy"></div>
        <div class="layers-footer"><span id="layer-count">0 objects</span><div class="layer-actions layer-icon-bar">
          <button type="button" id="layer-forward-btn" class="layer-icon" title="Bring forward" aria-label="Bring forward"><svg viewBox="0 0 16 16"><rect x="2" y="6" width="8" height="8"/><path d="M6 3h8v8M10 5V1M8 3l2-2 2 2"/></svg></button>
          <button type="button" id="layer-backward-btn" class="layer-icon" title="Send backward" aria-label="Send backward"><svg viewBox="0 0 16 16"><rect x="6" y="2" width="8" height="8"/><path d="M10 13H2V5M6 11v4m-2-2 2 2 2-2"/></svg></button>
          <button type="button" id="group-btn" class="layer-icon" title="Group selection" aria-label="Group"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" stroke-dasharray="2 2"/><rect x="4" y="4" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/></svg></button>
          <button type="button" id="ungroup-btn" class="layer-icon" title="Ungroup selection" aria-label="Ungroup"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="5" height="5"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="m7 9 2-2"/></svg></button>
          <button type="button" id="rename-layer-btn" class="layer-icon" title="Rename layer" aria-label="Rename"><svg viewBox="0 0 16 16"><path d="M2 11 11 2l3 3-9 9-4 1zM9 4l3 3"/></svg></button>
          <button type="button" id="delete-layer-btn" class="layer-icon" title="Delete selection" aria-label="Delete"><svg viewBox="0 0 16 16"><path d="M2 4h12M5 4V2h6v2M4 4l1 10h6l1-10M7 7v4m2-4v4"/></svg></button>
        </div></div>
      </aside>
    </div>

    <footer class="statusbar">
      <span id="status-left">Ready</span>
      <span id="status-right">Vector studio · v2</span>
    </footer>
  </div>
  <script type="module" src="./illustrator-lite.js?v=20261126-arrows"></script>
</body>
</html>
