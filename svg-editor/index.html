<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>SVG Editor - tylerlengyel.com</title>

  <meta
    name="description"
    content="SVG Editor embedded from its own GitHub repo."
  />

  <meta name="theme-color" content="#EAE7DF" />
  <script src="/assets/site-shell.js"></script>
  <link rel="stylesheet" href="/assets/site-theme.css" />

  <style>
    :root {
      --off-white: #f2f0ea;

      --dark-0: #050505;
      --dark-1: #111111;
      --dark-2: #1d1d1d;

      --panel-dark-0: #080808;
      --panel-dark-1: #151515;
      --panel-dark-2: #232323;

    }

    .paper-panel {
      background: var(--paper);
      border: 2px solid var(--line-strong);
      box-shadow: 6px 6px 0 var(--shadow-pixel);
    }

    .paper-panel h1,
    .paper-panel .eyebrow {
      color: var(--accent-ink);
    }

    .paper-panel .lede {
      color: var(--muted);
    }

    .frame-panel,
    .notice {
      background: linear-gradient(
        135deg,
        var(--panel-dark-0) 0%,
        var(--panel-dark-1) 50%,
        var(--panel-dark-2) 100%
      );

      border: 2px solid rgba(177,230,255,0.24);
      box-shadow: 6px 6px 0 #080a0c;

      color: var(--off-white);
    }

    .embedded-frame {
      border-radius: 0;
      background: #050505;
    }

    .link-button,
    .button {
      background: linear-gradient(
        135deg,
        var(--panel-dark-0) 0%,
        var(--panel-dark-1) 50%,
        var(--panel-dark-2) 100%
      );

      border: 2px solid rgba(177,230,255,0.24);

      color: var(--off-white);

      box-shadow: 3px 3px 0 #080a0c;
    }

    .link-button:hover,
    .button:hover,
    .link-button:focus-visible,
    .button:focus-visible {
      transform: translate(2px, 2px);
      border-color: var(--accent);
      box-shadow: 1px 1px 0 #080a0c;
    }

    @media (max-width: 720px) {

      .frame-shell { padding-top: 20px; }
    }
  </style>
</head>

<body>

  <a class="skip-link" href="#main-content">Skip to content</a>

  <header data-site-header="svg-editor"></header>

  <main id="main-content" class="page-shell is-wide frame-shell">

    <section class="paper-panel" data-writing-root>

      <p class="eyebrow">
        Freefitty
      </p>

      <h1>
        PhilAstrator
      </h1>

      <p class="lede">
        SVG Illustratoooor
      </p>

    </section>

    <section class="frame-panel" data-no-reveal>

      <iframe
        id="editor-frame"
        class="embedded-frame"
        src="/svg-editor/editor.html?v=20260507-names2"
        title="SVG Editor"
        loading="eager"
        allow="clipboard-write *; clipboard-read *">
      </iframe>

    </section>

    <div id="editor-health" class="notice" hidden></div>

    <noscript>
      This page loads a local SVG editor runtime. Enable JavaScript to use it.
    </noscript>

  </main>

  <script defer src="/assets/site-theme.js"></script>

  <script>
    (() => {

      const frame =
        document.getElementById("editor-frame");

      const health =
        document.getElementById("editor-health");

      if (!frame || !health) {
        console.error("[svg-editor] Missing frame health check elements.");
        return;
      }

      const fail = (message) => {

        health.hidden = false;
        health.textContent = message;

        console.error(`[svg-editor] ${message}`);
      };

      let loaded = false;

      const timeoutId = setTimeout(() => {

        if (!loaded) {
          fail("SVG editor initialization timed out. Try reloading the page.");
        }

      }, 5000);

      frame.addEventListener("load", () => {

        loaded = true;
        clearTimeout(timeoutId);

      });

      frame.addEventListener("error", () => {

        clearTimeout(timeoutId);

        fail("SVG editor failed to load in the embedded frame.");

      });

    })();
  </script>

</body>
</html>
