  <main id="main-content" class="page-shell is-wide frame-shell">
    <section class="paper-panel" data-writing-root>
      <p class="eyebrow">Tooling</p>
      <h1>SVG Systems Lab</h1>
      <p class="lede">
        The editor runs locally in an embedded frame so the runtime stays fast while the page chrome
        matches the rest of the site.
      </p>
      <p style="margin: 18px 0 0;">
        <button class="link-button" data-motion-toggle type="button">Writing motion: on</button>
      </p>
    </section>

    <section class="frame-panel" data-no-reveal>
      <iframe
        id="editor-frame"
        class="embedded-frame"
        src="/svg-editor/editor.html?v=20260225-reset"
        title="SVG Editor"
        loading="eager"
        allow="clipboard-write *; clipboard-read *">
      </iframe>
    </section>

    <div id="editor-health" class="notice" hidden></div>

    <noscript>This page loads a local SVG editor runtime. Enable JavaScript to use it.</noscript>
  </main>

  <script defer src="/assets/site-theme.js"></script>
  <script>
    (() => {
      const frame = document.getElementById("editor-frame");
      const health = document.getElementById("editor-health");
      if (!frame || !health) {
        console.error("[svg-editor] Missing frame health check elements.");
        return;
      }

      const fail = (message) => {
        health.hidden = false;
        health.textContent = message;
        console.error(`[svg-editor] ${message}`);
      };

      let loaded = false;
      const timeoutId = setTimeout(() => {
        if (!loaded) {
          fail("SVG editor initialization timed out. Try reloading the page.");
        }
      }, 5000);

      frame.addEventListener("load", () => {
        loaded = true;
        clearTimeout(timeoutId);
      });

      frame.addEventListener("error", () => {
        clearTimeout(timeoutId);
        fail("SVG editor failed to load in the embedded frame.");
      });
    })();
  </script>
