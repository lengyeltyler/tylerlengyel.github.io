<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SVG Editor — tylerlengyel.com</title>
  <meta name="description" content="React SVG Editor embedded from its own GitHub repo." />
  <style>
    html,body {height:100%;margin:0;background:#0b0b0d;color:#f2f2f5;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{display:flex;flex-direction:column;min-height:100%}
    header{position:sticky;top:0;z-index:10;display:flex;gap:16px;
      align-items:center;padding:10px 12px;background:rgba(0,0,0,.85);
      border-bottom:1px solid rgba(155,255,176,.25)}
    header a{color:#9bffb0;text-decoration:none}
    header a:hover{text-decoration:underline}
    .frame{flex:1;min-height:calc(100vh - 52px);border:0;width:100%}
    .health{padding:10px 12px;border-top:1px solid rgba(255,120,120,.35);
      color:#ffd7d7;background:rgba(90,0,0,.35);font-size:14px}
    .health[hidden]{display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/">Home</a>
      <a href="/writing.html">Hypotheses Page</a>
      <a href="/linearA/">Linear A</a>
      <a href="/createPhil/">createPhil</a>
      <strong>SVG Editor</strong>
    </header>

    <!-- Embed the build from the svg-editor repo -->
    <iframe
      id="editor-frame"
      class="frame"
      src="/svg-editor/editor.html?v=20260225-reset"
      title="SVG Editor"
      loading="eager"
      allow="clipboard-write *; clipboard-read *">
    </iframe>
    <div id="editor-health" class="health" hidden></div>

    <noscript>This page loads a local SVG editor runtime. Enable JavaScript to use it.</noscript>
  </div>
  <script>
    (() => {
      const frame = document.getElementById("editor-frame");
      const health = document.getElementById("editor-health");
      if (!frame || !health) {
        console.error("[svg-editor] Missing frame health check elements.");
        return;
      }

      const fail = (message) => {
        health.hidden = false;
        health.textContent = message;
        console.error(`[svg-editor] ${message}`);
      };

      let loaded = false;
      const timeoutId = setTimeout(() => {
        if (!loaded) {
          fail("SVG editor initialization timed out. Try reloading the page.");
        }
      }, 5000);

      frame.addEventListener("load", () => {
        loaded = true;
        clearTimeout(timeoutId);
      });

      frame.addEventListener("error", () => {
        clearTimeout(timeoutId);
        fail("SVG editor failed to load in the embedded frame.");
      });
    })();
  </script>
</body>
</html>
